default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
  pool: <%= ENV.fetch("DB_POOL", 5) %>

development:
  <<: *default
  database: sequra_challenge_development

test:
  <<: *default
  database: sequra_challenge_test
